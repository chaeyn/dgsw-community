spring.application.name=dgsw-community

# ---------- H2 Database (in-memory) ----------
spring.datasource.url=jdbc:h2:mem:community;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console : http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ---------- 더미 데이터(data.sql) 자동 실행 ----------
spring.sql.init.mode=always

# ---------- JWT ----------
# 운영 환경에서는 JWT_SECRET 환경 변수로 주입한다. (HS256 : 32바이트 이상)
jwt.secret=${JWT_SECRET:dgsw-community-local-dev-secret-key-change-me-1234567890}
jwt.access-token-validity-seconds=3600
jwt.refresh-token-validity-seconds=1209600

# ---------- Logging ----------
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
